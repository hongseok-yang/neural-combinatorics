name = "OddCycleBound"
defaultTargets = ["OddCycleBound"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.31.0"

[[lean_lib]]
name = "OddCycleBound"
# Strict per-process memory cap (MB) for the Hfin reflection `decide +kernel` builds.
# weakLeanArgs do not affect the module trace/hash, so this does not force a rebuild.
weakLeanArgs = ["-M", "48000"]
