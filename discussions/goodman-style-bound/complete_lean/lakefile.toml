name = "OddCycleBound"
defaultTargets = ["OddCycleBound"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.31.0"

[[lean_lib]]
name = "OddCycleBound"
# `Main.lean` holds the final theorem and is deliberately not imported by the root module
# (only `CheckComplete.lean` may import it), so name it explicitly here to keep it under `lake build`.
globs = ["OddCycleBound", "OddCycleBound.Main"]
# NOTE: deliberately NO weakLeanArgs memory cap and NO computational certificates.
# This package must build on a 16 GB machine. Do not add `decide +kernel`,
# `native_decide`, or maxHeartbeats above 1600000 anywhere.
